[package]
name = "jarvis-island"
version = "2.0.0"
description = "TwoCode-Style Dynamic Island for Jarvis"
authors = ["Jarvis Team"]
edition = "2021"

[lib]
name = "jarvis_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-vibrancy = "0.5.2"
